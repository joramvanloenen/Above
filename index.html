<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#a5af75">
  <meta name="description" content="Above — a knight and sheepdog pixel-art adventure, made for touch.">
  <title>Above — The Lost Flock</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game" aria-label="Above, a touchscreen knight and sheepdog adventure">
    <canvas id="world" aria-label="Pixel art meadow with a knight, companion sheepdog and a flock of sheep"></canvas>
    <div id="vignette" aria-hidden="true"></div>
    <header class="topbar" aria-live="polite">
      <div class="identity"><span class="eyebrow">A LITTLE ADVENTURE</span><span class="wordmark">ABOVE<span class="star">✳</span></span></div>
      <button id="switch" class="switch-character" type="button" aria-label="Switch control from knight to dog" title="Switch character">
        <span class="switch-glyph" aria-hidden="true">⚔ ↔ 🐾</span><span class="switch-text">KNIGHT</span>
      </button>
      <button id="weapon" class="weapon-switch" type="button" aria-label="Switch from sword to crossbow" title="Change weapon">
        <span class="weapon-glyph" aria-hidden="true">⚔</span><span id="weapon-name">SWORD</span>
      </button>
      <div class="counter"><span class="counter-label">FLOCK HOME</span><span class="count"><span id="collected">0</span><span class="slash">/</span><span id="total">8</span></span></div>
    </header>
    <div id="health" class="health" aria-live="polite"><span class="health-hearts" id="hearts">♥ ♥ ♥ ♥ ♥</span><span id="area-name">SUNLIT MEADOW</span></div>
    <div id="boss-bar" class="boss-bar" hidden><span id="boss-title">THE MIRE KING</span><span class="boss-meter"><span id="boss-fill"></span></span></div>
    <section class="notice" id="notice" aria-live="polite">
      <span id="notice-title">THE MEADOW IS WAITING</span>
      <span id="notice-copy">A crossbow, wandering enemies, hidden tombs and a monster in the marsh await. Switch weapons at the top.</span>
    </section>
    <div class="bottom-hint" id="hint" aria-hidden="true"><span class="hint-line"></span> TOUCH &amp; DRAG TO MOVE <span class="hint-line"></span></div>
    <button id="action" type="button" aria-label="Attack" title="Attack or interact">
      <svg id="action-icon" viewBox="0 0 48 48" role="presentation" aria-hidden="true">
        <path d="m33 6 8 8-19 19-7-7L33 6Z" fill="#dfe7e1" stroke="#443753" stroke-width="2"/>
        <path d="m8 30 9 9M11 37l6-6M16 39l-5 5" stroke="currentColor" stroke-width="5" stroke-linecap="square"/>
        <path d="m30 11 6 6" stroke="#ffffff" stroke-width="2"/>
      </svg>
      <span class="button-label">ATTACK</span>
    </button>
    <div id="flash" aria-hidden="true"></div>
  </main>
  <script src="./game.js" defer></script>
</body>
</html>
